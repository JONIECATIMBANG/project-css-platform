<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css"><title>Reset password – CSS PLATFORM</title>
</head>
<body><main class="card wide"><div class="hero"><img class="logo" src="logo.png" alt="CSS logo"><h1>NEW PASSWORD</h1></div><form id="resetForm" novalidate><label>New password<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label><p class="err" id="err" role="alert"></p><button class="btn main">RESET PASSWORD</button></form><p class="ok" id="done" hidden>Your password has been reset. You can now log in.</p><a class="btn" href="index.html">BACK</a></main>
<script src="js/reset-password.js"></script><script src="/js/pwa.js"></script></body>
</html>
